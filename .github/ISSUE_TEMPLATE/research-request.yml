name: "追加調査のリクエスト / Request additional research"
description: "既存項目の深掘りや新たな調査対象 / Follow-up questions or new research topics"
title: "[Research request] "
labels: ["public-feedback", "research-request"]
body:
  - type: markdown
    attributes:
      value: |
        投稿内容は公開されます。機密情報、個人情報、脆弱性の詳細は投稿しないでください。
        リクエストは調査候補として確認します。投稿だけでは調査開始や正式採用を意味しません。
        Submissions are public. Do not include confidential information, personal data, or vulnerability details.
        Requests are reviewed as research candidates; submitting one does not start a research run or approve a new topic.
  - type: textarea
    id: target
    attributes:
      label: "対象ID / Target IDs"
  - type: input
    id: page_url
    attributes:
      label: "関連ページ / Related page URL"
  - type: input
    id: source_commit
    attributes:
      label: "表示時点のコミット / Displayed build commit"
  - type: input
    id: language
    attributes:
      label: "表示言語 / Display language"
  - type: textarea
    id: description
    attributes:
      label: "調査してほしい内容 / What would you like investigated?"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "背景・期待する成果（任意） / Background and desired outcome (optional)"
  - type: textarea
    id: sources
    attributes:
      label: "公開参考資料（任意） / Public references (optional)"
  - type: checkboxes
    id: boundary
    attributes:
      label: "公開範囲 / Public information boundary"
      options:
        - label: "公開してよい情報のみです / This request contains only information suitable for public disclosure."
          required: true
