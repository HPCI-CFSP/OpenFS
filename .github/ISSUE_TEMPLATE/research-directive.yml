name: Research directive
description: Add or change an OpenFS research instruction
title: "[Directive] "
labels: ["research-directive"]
body:
  - type: markdown
    attributes:
      value: Do not include NDA, confidential, credential, or personal information in this public issue.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should OpenFS investigate or change?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and suggested sources
      description: Specify technologies, organizations, dates, languages, or public pages to include or exclude.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Describe the requested structure, comparison, or decision support.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [low, normal, high, urgent]
      default: 1
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Information boundary
      options:
        - label: I confirm that this issue contains public information only.
          required: true
