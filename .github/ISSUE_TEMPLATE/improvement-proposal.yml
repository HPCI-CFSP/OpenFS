name: "改善の提案 / Suggest an improvement"
description: "使いやすさや機能の改善 / Usability or feature improvements"
title: "[Suggestion] "
labels: ["public-feedback", "improvement-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        投稿内容は公開されます。機密情報、個人情報、脆弱性の詳細は投稿しないでください。
        Submissions are public. Do not include confidential information, personal data, or vulnerability details.
  - type: textarea
    id: target
    attributes:
      label: "対象ID / Target IDs"
  - type: input
    id: page_url
    attributes:
      label: "関連ページ / Related page URL"
  - type: input
    id: source_commit
    attributes:
      label: "表示時点のコミット / Displayed build commit"
  - type: input
    id: language
    attributes:
      label: "表示言語 / Display language"
  - type: textarea
    id: description
    attributes:
      label: "提案と期待する効果 / Suggestion and expected benefit"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "公開参考資料（任意） / Public references (optional)"
  - type: checkboxes
    id: boundary
    attributes:
      label: "公開範囲 / Public information boundary"
      options:
        - label: "公開してよい情報のみです / This suggestion contains only information suitable for public disclosure."
          required: true
