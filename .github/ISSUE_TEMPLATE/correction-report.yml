name: "誤り・不具合の報告 / Report an error"
description: "公開内容の訂正や表示不具合 / Corrections to public content or display problems"
title: "[Correction] "
labels: ["public-feedback", "correction-report"]
body:
  - type: markdown
    attributes:
      value: |
        投稿内容は公開されます。機密情報、個人情報、脆弱性の詳細は投稿しないでください。
        Submissions are public. Do not include confidential information, personal data, or vulnerability details.
  - type: textarea
    id: target
    attributes:
      label: "対象ID / Target IDs"
  - type: input
    id: page_url
    attributes:
      label: "該当ページ / Page URL"
  - type: input
    id: source_commit
    attributes:
      label: "表示時点のコミット / Displayed build commit"
  - type: input
    id: language
    attributes:
      label: "表示言語 / Display language"
  - type: textarea
    id: description
    attributes:
      label: "誤り・不具合の内容 / What is wrong?"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: "訂正案（任意） / Suggested correction (optional)"
  - type: textarea
    id: sources
    attributes:
      label: "公開根拠URL（任意） / Public supporting URLs (optional)"
  - type: checkboxes
    id: boundary
    attributes:
      label: "公開範囲 / Public information boundary"
      options:
        - label: "公開してよい情報のみです / This report contains only information suitable for public disclosure."
          required: true
