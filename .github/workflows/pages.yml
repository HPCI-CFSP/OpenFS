name: Publish OpenFS Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/verify_publication.py"
      - ".github/inject_deployment_provenance.py"
      - ".github/workflows/pages.yml"
      - "PUBLICATION_MANIFEST.json"
      - "assets/branding/**"
      - "knowledge/public/**"
      - "public-site/**"
      - "reports/exports/**"
      - "roadmaps/scenarios/accepted/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.OPENFS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out publication repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify publication bundle
        run: python3 .github/verify_publication.py
      - name: Prepare Pages artifact with deployment provenance
        run: |
          python3 .github/inject_deployment_provenance.py \
            --mode production \
            --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.OPENFS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
