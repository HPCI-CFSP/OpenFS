name: Publish OpenFS Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "config/publication-policy.json"
      - "config/publication-i18n.json"
      - "config/research-baseline.json"
      - "config/global-technology-scope.json"
      - "roadmaps/scenarios/accepted/**"
      - "reports/exports/**"
      - "reviews/directives/**"
      - "knowledge/public/**"
      - "tools/build_pages_site.py"
      - "requirements-validation.txt"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.OPENFS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate public inputs
        run: python3 tools/validate_repository.py
      - name: Install pinned contract validators
        run: |
          python3 -m pip install --only-binary=:all: --requirement requirements-validation.txt
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build static site
        run: python3 tools/build_pages_site.py --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.OPENFS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
