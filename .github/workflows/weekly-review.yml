name: Review OpenFS Weekly Results

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: Optional ISO week such as 2026-W35
        required: false
        type: string
      publish_issues:
        description: Create or update sanitized grouped exception Issues
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openfs-weekly-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || vars.OPENFS_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate review inputs
        run: |
          python3 tools/validate_repository.py
          python3 -m unittest discover -s tests -v
      - name: Require verified Research Web execution profile
        env:
          OPENFS_SECURITY_PROFILE_ID: ${{ vars.OPENFS_SECURITY_PROFILE_ID }}
        run: |
          test -n "$OPENFS_SECURITY_PROFILE_ID"
          python3 tools/check_research_web_security.py \
            --require-production-profile \
            --profile-id "$OPENFS_SECURITY_PROFILE_ID"
          mkdir -p _automation
          python3 tools/evaluate_operational_readiness.py \
            --require-ready \
            --output _automation/operational-readiness.json
      - name: Generate review artifacts
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
          OPENFS_SECURITY_PROFILE_ID: ${{ vars.OPENFS_SECURITY_PROFILE_ID }}
        run: |
          WEEK="${REQUESTED_WEEK:-$(date -u --date='7 days ago' +%G-W%V)}"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p _automation
          python3 tools/audit_roadmap_sources_via_fetch_broker.py \
            --output _automation/roadmap-source-audit.json \
            --profile-id "$OPENFS_SECURITY_PROFILE_ID" \
            --workers 8
          python3 tools/build_roadmap_source_triage.py \
            --audit _automation/roadmap-source-audit.json \
            --output _automation/roadmap-source-triage.json
          python3 tools/build_roadmap_freshness_audit.py \
            --generated-at "$GENERATED_AT" \
            --source-audit _automation/roadmap-source-audit.json \
            --output _automation/roadmap-freshness-audit.json
          python3 tools/build_roadmap_gap_queue.py \
            --generated-at "$GENERATED_AT" \
            --output _automation/roadmap-gap-queue.json
          python3 tools/prepare_freshness_issue.py \
            --audit _automation/roadmap-freshness-audit.json \
            --output _automation/roadmap-freshness-issue.json
          python3 tools/generate_weekly_digest.py \
            --week "$WEEK" \
            --generated-at "$GENERATED_AT"
          python3 tools/prepare_exception_issues.py \
            --generated-at "$GENERATED_AT" \
            > _automation/exception-issues.json
          printf '%s\n' "$WEEK" > _automation/review-week.txt
      - name: Upload internal review artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openfs-weekly-review
          path: |
            _automation/exception-issues.json
            _automation/roadmap-source-audit.json
            _automation/roadmap-source-triage.json
            _automation/roadmap-freshness-audit.json
            _automation/roadmap-gap-queue.json
            _automation/roadmap-freshness-issue.json
            _automation/review-week.txt
            reviews/digests/*.json
            reviews/digests/*.md
            reviews/issues/groups/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized publication payloads
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openfs-weekly-issue-payloads
          path: |
            _automation/exception-issues.json
            _automation/roadmap-freshness-issue.json
          if-no-files-found: error
          retention-days: 7

  publish-issues:
    needs: review
    if: needs.review.result == 'success' && (vars.OPENFS_REVIEW_ENABLED == 'true' || inputs.publish_issues == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted publication code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download sanitized publication payloads
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: openfs-weekly-issue-payloads
          path: _automation
      - name: Publish or update grouped exception Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          jq -r '.prepared[]' _automation/exception-issues.json | while IFS= read -r payload; do
            python3 tools/publish_github_issue.py --payload "$payload"
          done
          python3 tools/publish_github_issue.py \
            --payload _automation/roadmap-freshness-issue.json
