name: Verify OpenFS Pages Preview

on:
  pull_request:
    paths:
      - ".github/verify_publication.py"
      - ".github/inject_deployment_provenance.py"
      - ".github/workflows/pages-preview.yml"
      - "PUBLICATION_MANIFEST.json"
      - "assets/branding/**"
      - "knowledge/public/**"
      - "public-site/**"
      - "reports/exports/**"
      - "roadmaps/scenarios/accepted/**"

permissions:
  contents: read

concurrency:
  group: openfs-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify publication bundle
        run: python3 .github/verify_publication.py
      - name: Prepare preview artifact with run provenance
        env:
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/inject_deployment_provenance.py \
            --mode preview \
            --public-commit "$PREVIEW_COMMIT" \
            --output _preview-site
      - name: Upload reviewable Pages preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openfs-pages-preview-pr-${{ github.event.pull_request.number }}
          path: _preview-site
          if-no-files-found: error
          retention-days: 14
