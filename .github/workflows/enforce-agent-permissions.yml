name: Enforce Agent Permissions

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the trusted base revision. Do not check out
      # or execute code from the pull request in this job.
      - name: Check out trusted base policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch untrusted head for path comparison only
        env:
          OPENFS_PR_NUMBER: ${{ github.event.number }}
        run: git fetch --no-tags --depth=1 origin "pull/${OPENFS_PR_NUMBER}/head"
      - name: Enforce registered agent role paths using trusted code
        env:
          OPENFS_HEAD_REF: ${{ github.head_ref }}
          OPENFS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENFS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_agent_branch.py
