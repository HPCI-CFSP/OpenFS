name: Update system planning pull request

on:
  push:
    branches:
      - automation/create-system-planning-pr-20260828

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Check out control branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Update pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: "24"
          PR_TITLE: Harden continuous research and expand decision evidence
          BODY_FILE: .github/pr-body-system-planning-security.md
        run: |
          set -euo pipefail

          response="$(
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --raw-field title="${PR_TITLE}" \
              --raw-field body="$(cat "${BODY_FILE}")"
          )"

          printf 'Pull request: %s\n' "$(jq -r '.html_url' <<<"${response}")"
