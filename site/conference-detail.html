<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Chips 2026 | OpenFS</title>
  <link rel="stylesheet" href="{{ROOT_PREFIX}}styles.css?v={{ASSET_VERSION}}">
</head>
<body data-page="conference" data-root-prefix="{{ROOT_PREFIX}}">
  <header class="app-header">
    <div class="header-inner">
      {{SITE_IDENTITY}}
      <div class="language-switcher" role="group" aria-label="Language">
        <button type="button" data-language="ja" aria-pressed="true">日本語</button>
        <button type="button" data-language="en" aria-pressed="false">English</button>
      </div>
    </div>
    <nav class="tabs" aria-label="OpenFS">
      <a href="{{ROOT_PREFIX}}#overview" data-hc-copy="overview">概要</a>
      <a href="{{ROOT_PREFIX}}#catalog" data-hc-copy="catalog">調査カタログ</a>
      <a href="{{ROOT_PREFIX}}roadmaps/" data-hc-copy="roadmaps">ロードマップ</a>
      <a href="{{ROOT_PREFIX}}scenarios/" data-hc-copy="plans">システム整備計画案</a>
      <a href="{{ROOT_PREFIX}}#reports" data-i18n="navReports" data-hc-copy="reports">報告書</a>
      <a href="{{ROOT_PREFIX}}feedback/" data-feedback-nav>Feedback</a>
      <a href="{{ROOT_PREFIX}}search/" data-i18n="navSearch" data-hc-copy="search">検索</a>
    </nav>
  </header>
  <main>
    <section class="section conference-section">
      <h2 id="conference-title">Hot Chips 2026</h2>
      <p id="conference-scope"></p>
      <p id="conference-caveat" class="decision-provisional-notice"></p>
      <p id="conference-counts" aria-live="polite"></p>
      <div class="conference-filters">
        <label><span data-hc-copy="organization">発表・共著組織</span><select id="conference-organization"></select></label>
        <label><span data-hc-copy="coverage">確認状況</span><select id="conference-status"></select></label>
      </div>
      <div id="conference-entries"></div>
      <h2 data-hc-copy="partners">開発協力組織</h2><div id="conference-partners"></div>
      <h2 data-hc-copy="related">会議外の関連発表</h2><div id="conference-related"></div>
      <h2>Coverage Gaps</h2><div id="conference-gaps"></div>
      <h2 data-hc-copy="sources">確認した情報源と取得状況</h2><div id="conference-sources"></div>
    </section>
  </main>
  <script src="{{ROOT_PREFIX}}data/openfs-public.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}feedback.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}conferences.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
