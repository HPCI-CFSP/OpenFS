<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback | OpenFS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ROOT_PREFIX}}styles.css?v={{ASSET_VERSION}}">
</head>
<body data-page="feedback" data-root-prefix="{{ROOT_PREFIX}}">
  <header class="app-header">
    <div class="header-inner">
      {{SITE_IDENTITY}}
      <div class="header-controls">
        <div class="header-status"><span class="status-dot" aria-hidden="true"></span><span data-feedback-copy="publicOnly">公開情報のみ</span></div>
        <div class="language-switcher" role="group" aria-label="表示言語" data-feedback-aria="languageControl"><button type="button" data-language="ja" aria-pressed="true">日本語</button><button type="button" data-language="en" aria-pressed="false">English</button></div>
      </div>
    </div>
    <nav class="tabs" aria-label="サイト内ナビゲーション" data-feedback-aria="siteNavigation">
      <a href="{{ROOT_PREFIX}}#overview" data-feedback-copy="navOverview">概要</a>
      <a href="{{ROOT_PREFIX}}#catalog" data-feedback-copy="navCatalog">調査カタログ</a>
      <a href="{{ROOT_PREFIX}}roadmaps/" data-feedback-copy="navRoadmaps">ロードマップ</a>
      <a href="{{ROOT_PREFIX}}scenarios/" data-feedback-copy="navScenarios">システム整備計画案</a>
      <a href="{{ROOT_PREFIX}}#reports" data-feedback-copy="navReports">報告書</a>
      <a href="{{ROOT_PREFIX}}feedback/" class="active" aria-current="page" data-feedback-nav data-feedback-copy="navFeedback">Feedback</a>
      <a href="{{ROOT_PREFIX}}search/" data-i18n="navSearch" data-feedback-copy="navSearch">検索</a>
    </nav>
  </header>
  <main>
    <section class="section feedback-section">
      <div class="section-heading"><h2 data-feedback-copy="feedbackTitle">Feedback</h2></div>
      <p class="feedback-public-notice" data-feedback-copy="publicNotice">投稿内容は公開されます。機密情報、個人情報、脆弱性の詳細は投稿しないでください。</p>
      <p data-feedback-copy="signIn">投稿にはGitHubへのログインが必要です。</p>
      <div class="feedback-option"><h3 data-feedback-copy="correctionTitle">内容の誤り・表示の不具合</h3><div id="feedback-correction" class="feedback-actions"></div></div>
      <div class="feedback-option"><h3 data-feedback-copy="researchTitle">追加調査のリクエスト</h3><div id="feedback-research" class="feedback-actions"></div></div>
      <div class="feedback-option"><h3 data-feedback-copy="suggestionTitle">使いやすさ・機能の改善</h3><div id="feedback-suggestion" class="feedback-actions"></div></div>
      <div class="feedback-option"><h3 data-feedback-copy="reportsTitle">報告と対応状況</h3><a id="feedback-existing" href="https://github.com/HPCI-CFSP/OpenFS/issues" target="_blank" rel="noopener noreferrer" data-feedback-copy="existing">既存の報告</a></div>
    </section>
  </main>
  <footer><div><strong>OpenFS</strong><span data-feedback-copy="footerDescription">HPCI-CFSP 公開調査ビュー</span></div><div><a href="https://github.com/HPCI-CFSP/OpenFS">GitHub Repository</a></div></footer>
  <script src="{{ROOT_PREFIX}}data/openfs-public.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}feedback.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
