<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenFS P0ロードマップの四半期、根拠、Coverage Gap、依存関係の横断比較">
  <title>Roadmap comparison | OpenFS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ROOT_PREFIX}}styles.css?v={{ASSET_VERSION}}">
</head>
<body data-page="roadmap-compare" data-root-prefix="{{ROOT_PREFIX}}">
  <header class="app-header">
    <div class="header-inner">
      <div class="identity"><span class="organization">HPCI-CFSP</span><h1><a href="{{ROOT_PREFIX}}">OpenFS</a></h1><p data-i18n="tagline">公開調査カタログと整備計画成果</p></div>
      <div class="header-controls">
        <div class="header-status"><span class="status-dot" aria-hidden="true"></span><span data-i18n="publicOnly">公開情報のみ</span><a id="site-updated" class="site-updated" href="https://github.com/HPCI-CFSP/OpenFS" target="_blank" rel="noopener noreferrer"></a></div>
        <div class="language-switcher" role="group" data-i18n-aria-label="languageControl" aria-label="表示言語"><button type="button" data-language="ja" aria-pressed="true">日本語</button><button type="button" data-language="en" aria-pressed="false">English</button></div>
      </div>
    </div>
    <nav class="tabs" aria-label="サイト内ナビゲーション"><a href="{{ROOT_PREFIX}}#overview" data-i18n="navOverview">概要</a><a href="{{ROOT_PREFIX}}#catalog" data-i18n="navCatalog">調査カタログ</a><a href="{{ROOT_PREFIX}}roadmaps/" class="active" data-i18n="navRoadmaps">ロードマップ</a><a href="{{ROOT_PREFIX}}#scenarios" data-i18n="navScenarios">整備シナリオ</a><a href="{{ROOT_PREFIX}}#reports" data-i18n="navReports">報告書</a></nav>
  </header>
  <main>
    <section class="section roadmap-compare-page">
      <nav class="breadcrumb" aria-label="パンくずリスト"><a href="{{ROOT_PREFIX}}">OpenFS</a><span>/</span><a href="{{ROOT_PREFIX}}roadmaps/" data-i18n="navRoadmaps">ロードマップ</a><span>/</span><span data-i18n="compareRoadmaps">6本を比較</span></nav>
      <div class="section-heading roadmap-page-heading"><div><span class="eyebrow" data-i18n="compareKicker">P0初期公開波</span><h2 data-i18n="compareTitle">ロードマップ横断比較</h2></div><p data-i18n="compareLead">重要マイルストーン、根拠カバレッジ、Coverage Gap、ロードマップ間依存を同じ尺度で比較します。</p></div>
      <section class="compare-controls-section"><h3 data-i18n="selectedRoadmaps">比較対象</h3><div id="compare-controls" class="compare-controls"></div></section>
      <div id="compare-metrics" class="compare-metrics"></div>
      <section class="compare-section"><h3 data-i18n="keyMilestones">重要マイルストーン</h3><div id="compare-timeline" class="roadmap-table-wrap"></div></section>
      <section class="compare-section"><h3 data-i18n="dependencyMap">依存関係一覧</h3><ul id="compare-dependencies" class="compare-dependencies"></ul></section>
    </section>
  </main>
  <footer><div><strong>OpenFS</strong><span data-i18n="footerDescription">HPCI-CFSP 公開調査ビュー</span></div><div><a href="https://github.com/HPCI-CFSP/OpenFS">GitHub Repository</a><span id="license-status"></span></div></footer>
  <script src="{{ROOT_PREFIX}}data/openfs-public.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}roadmaps.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
