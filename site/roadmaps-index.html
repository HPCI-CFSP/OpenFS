<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenFSで公開しているハードウェア、システムソフトウェア、アプリケーションのロードマップ一覧">
  <title>ロードマップ一覧 | OpenFS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ROOT_PREFIX}}styles.css?v={{ASSET_VERSION}}">
</head>
<body data-page="roadmap-index" data-root-prefix="{{ROOT_PREFIX}}">
  <header class="app-header">
    <div class="header-inner">
      <div class="identity">
        <span class="organization">HPCI-CFSP</span>
        <h1><a href="{{ROOT_PREFIX}}">OpenFS</a></h1>
        <p data-i18n="tagline">公開調査カタログとシステム整備計画案</p>
      </div>
      <div class="header-controls">
        <div class="header-status" data-i18n-aria-label="publicStatus" aria-label="公開状態">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-i18n="publicOnly">公開情報のみ</span>
          <a id="site-updated" class="site-updated" href="https://github.com/HPCI-CFSP/OpenFS" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div class="language-switcher" role="group" data-i18n-aria-label="languageControl" aria-label="表示言語">
          <button type="button" data-language="ja" aria-pressed="true">日本語</button>
          <button type="button" data-language="en" aria-pressed="false">English</button>
        </div>
      </div>
    </div>
    <nav class="tabs" data-i18n-aria-label="siteNavigation" aria-label="サイト内ナビゲーション">
      <a href="{{ROOT_PREFIX}}#overview" data-i18n="navOverview">概要</a>
      <a href="{{ROOT_PREFIX}}#catalog" data-i18n="navCatalog">調査カタログ</a>
      <a href="{{ROOT_PREFIX}}roadmaps/?v={{ASSET_VERSION}}" class="active" data-i18n="navRoadmaps">ロードマップ</a>
      <a href="{{ROOT_PREFIX}}scenarios/" data-i18n="navScenarios">システム整備計画案</a>
      <a href="{{ROOT_PREFIX}}#reports" data-i18n="navReports">報告書</a>
    </nav>
  </header>

  <main>
    <section class="section roadmap-library-section">
      <nav class="breadcrumb" data-i18n-aria-label="breadcrumbs" aria-label="パンくずリスト"><a href="{{ROOT_PREFIX}}">OpenFS</a><span>/</span><span data-i18n="navRoadmaps">ロードマップ</span></nav>
      <div class="section-heading roadmap-page-heading">
        <div><span class="eyebrow" data-i18n="libraryKicker">公開ロードマップ索引</span><h2 data-i18n="libraryTitle">ロードマップ一覧</h2></div>
        <p data-i18n="libraryLead">ハードウェア、システムソフトウェア、アプリケーション、分野横断の見通しを検索し、専用ページで詳細を確認できます。</p>
      </div>
      <div class="roadmap-index-actions"><a class="action-link" href="compare/?v={{ASSET_VERSION}}" data-i18n="compareRoadmaps">6本を比較</a><a class="action-link" href="evidence/?v={{ASSET_VERSION}}" data-i18n="openEvidence">根拠情報の監査を開く</a></div>
      <div class="toolbar">
        <div class="segmented" role="group" data-i18n-aria-label="domainFilter" aria-label="分野フィルタ">
          <button type="button" class="active" data-roadmap-domain="all" data-i18n="all">すべて</button>
          <button type="button" data-roadmap-domain="hardware" data-i18n="domainHardware">ハードウェア</button>
          <button type="button" data-roadmap-domain="system-software" data-i18n="domainSystemSoftware">システムソフトウェア</button>
          <button type="button" data-roadmap-domain="applications" data-i18n="domainApplications">アプリケーション</button>
          <button type="button" data-roadmap-domain="cross-cutting" data-i18n="domainCrossCutting">分野横断</button>
        </div>
        <label class="search-control">
          <span data-i18n="search">検索</span>
          <input id="roadmap-search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="名称、分野" autocomplete="off">
        </label>
      </div>
      <div class="table-wrap">
        <table class="roadmap-library-table">
          <thead><tr><th data-i18n="roadmapColumn">ロードマップ</th><th data-i18n="domainColumn">分野</th><th data-i18n="horizonColumn">対象期間</th><th data-i18n="researchAsOf">調査基準日</th><th data-i18n="researchStatus">調査状況</th><th data-i18n="consensusStatus">合意判定状況</th><th data-i18n="updatedColumn">更新日時</th></tr></thead>
          <tbody id="roadmap-rows"></tbody>
        </table>
      </div>
      <p id="roadmap-empty" class="empty-state" data-i18n="noRoadmaps" hidden>条件に一致するロードマップはありません。</p>
    </section>
  </main>

  <footer>
    <div><strong>OpenFS</strong><span data-i18n="footerDescription">HPCI-CFSP 公開調査ビュー</span></div>
    <div><a href="https://github.com/HPCI-CFSP/OpenFS">GitHub Repository</a><span id="license-status"></span></div>
  </footer>
  <script src="{{ROOT_PREFIX}}data/openfs-public.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}roadmaps.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
