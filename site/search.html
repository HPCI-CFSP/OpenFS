<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenFSの調査項目、ロードマップ、用語、比較表、システム整備計画案、公開根拠を横断検索">
  <title>検索 | OpenFS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ROOT_PREFIX}}styles.css?v={{ASSET_VERSION}}">
</head>
<body data-page="search" data-root-prefix="{{ROOT_PREFIX}}">
  <header class="app-header">
    <div class="header-inner">
      <div class="identity"><span class="organization">HPCI-CFSP</span><h1><a href="{{ROOT_PREFIX}}">OpenFS</a></h1><p data-i18n="tagline">公開調査カタログとシステム整備計画案</p></div>
      <div class="header-controls">
        <div class="header-status"><span class="status-dot" aria-hidden="true"></span><span data-i18n="publicOnly">公開情報のみ</span></div>
        <div class="language-switcher" role="group" data-i18n-aria-label="languageControl" aria-label="表示言語"><button type="button" data-language="ja" aria-pressed="true">日本語</button><button type="button" data-language="en" aria-pressed="false">English</button></div>
      </div>
    </div>
    <nav class="tabs" data-i18n-aria-label="siteNavigation" aria-label="サイト内ナビゲーション">
      <a href="{{ROOT_PREFIX}}#overview" data-i18n="navOverview">概要</a>
      <a href="{{ROOT_PREFIX}}#catalog" data-i18n="navCatalog">調査カタログ</a>
      <a href="{{ROOT_PREFIX}}search/" class="active" data-i18n="navSearch">検索</a>
      <a href="{{ROOT_PREFIX}}roadmaps/?v={{ASSET_VERSION}}" data-i18n="navRoadmaps">ロードマップ</a>
      <a href="{{ROOT_PREFIX}}scenarios/" data-i18n="navScenarios">システム整備計画案</a>
      <a href="{{ROOT_PREFIX}}#reports" data-i18n="navReports">報告書</a>
    </nav>
  </header>
  <main>
    <section class="section search-page-section">
      <nav class="breadcrumb" data-i18n-aria-label="breadcrumbs" aria-label="パンくずリスト"><a href="{{ROOT_PREFIX}}">OpenFS</a><span>/</span><span data-i18n="searchTitle">横断検索</span></nav>
      <div class="section-heading"><div><span class="eyebrow" data-i18n="searchKicker">公開情報を探す</span><h2 data-i18n="searchTitle">横断検索</h2></div><p data-i18n="searchLead">調査項目、ロードマップ、技術用語、アプリケーション、HPCIシステム、比較表、システム整備計画案、公開根拠を一度に検索します。</p></div>
      <form id="global-search-form" class="global-search-form" role="search">
        <label class="global-search-input"><span data-i18n="queryLabel">検索語</span><input id="global-search-input" type="search" autocomplete="off" data-i18n-placeholder="queryPlaceholder" placeholder="例: HBM、Megatron、ストレージ"></label>
        <label><span data-i18n="typeLabel">種類</span><select id="global-search-type"><option value="all" data-i18n="allTypes">すべて</option><option value="topic" data-i18n="typeTopic">調査項目</option><option value="roadmap" data-i18n="typeRoadmap">ロードマップ</option><option value="track" data-i18n="typeTrack">技術・判断項目</option><option value="application" data-i18n="typeApplication">アプリケーション</option><option value="system" data-i18n="typeSystem">HPCIシステム</option><option value="term" data-i18n="typeTerm">用語</option><option value="comparison" data-i18n="typeComparison">比較表</option><option value="scenario" data-i18n="typeScenario">計画案</option><option value="source" data-i18n="typeSource">公開根拠</option></select></label>
        <button type="submit" class="primary-action" data-i18n="searchButton">検索</button>
      </form>
      <p id="global-search-summary" class="search-results-summary" aria-live="polite"></p>
      <div id="global-search-results" class="global-search-results"></div>
      <p id="global-search-empty" class="empty-state" data-i18n="emptySearch">検索語を入力してください。</p>
    </section>
  </main>
  <footer><div><strong>OpenFS</strong><span data-i18n="footerDescription">HPCI-CFSP 公開調査ビュー</span></div><div><a href="https://github.com/HPCI-CFSP/OpenFS">GitHub Repository</a></div></footer>
  <script src="{{ROOT_PREFIX}}data/openfs-public.js?v={{ASSET_VERSION}}"></script>
  <script src="{{ROOT_PREFIX}}search.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
